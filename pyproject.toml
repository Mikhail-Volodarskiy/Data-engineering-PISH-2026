[project]
name = "data-engineering-pish-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "gdown>=6.4.1",
    "pandas>=3.0.6",
    "pandera>=0.36.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
etl = "etl.main:main"